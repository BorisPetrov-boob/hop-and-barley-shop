upstream django {
    server web:8000;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 20m;
    charset utf-8;

    # Раздача статики и медиа напрямую nginx (из общих volume с контейнером web).
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /app/media/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;

        # HTML-страницы не кешируем в браузере (иначе после деплоя видна старая
        # разметка). Статика с хешами в имени кешируется отдельно (см. выше).
        add_header Cache-Control "no-store, must-revalidate" always;
        expires -1;
    }
}

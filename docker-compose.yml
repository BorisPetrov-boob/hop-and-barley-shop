name: hop-and-barley

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hopbarley}
      POSTGRES_USER: ${POSTGRES_USER:-hopbarley}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hopbarley}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hopbarley} -d ${POSTGRES_DB:-hopbarley}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hopbarley}:${POSTGRES_PASSWORD:-hopbarley}@db:5432/${POSTGRES_DB:-hopbarley}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
      SEED_DEMO: ${SEED_DEMO:-1}
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
  static:
